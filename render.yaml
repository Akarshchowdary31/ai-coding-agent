services:
  - type: web
    name: codepilot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: codepilot-projects
      mountPath: /opt/render/project/src/app/uploads
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CODEPILOT_USERS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
